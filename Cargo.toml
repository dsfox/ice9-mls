[package]
name = "mls"
version = "0.1.0"
edition = "2024"

[lib]
# staticlib for the phones, rlib so the tests can still link it here.
crate-type = ["staticlib", "rlib"]

[dependencies]
argon2 = "0.6.0"
hkdf = "0.13.0"
openmls = "0.9.0"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
rand = "0.10.3"
sha2 = "0.11.0"
